services:
  - type: web
    name: fraty-ai-backend
    runtime: node
    rootDir: backend
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        value: ""
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPENAI_MODEL
        value: gemini-3.5-flash-lite
      - key: MAX_REQUESTS_PER_MINUTE
        value: "10"
      - key: MEDIA_DIR
        value: ./media
      - key: MEDIA_TTL_SECONDS
        value: "86400"
      - key: BUILD_GITHUB_REPOSITORY
        value: mhmdfratyff-prog/fraty_ai
      - key: BUILD_GITHUB_WORKFLOW
        value: build-generated-android.yml
      - key: BUILD_GITHUB_REF
        value: main
      - key: BUILD_GITHUB_TOKEN
        sync: false
      - key: BUILD_WORKER_SECRET
        sync: false
